[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-assessment"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0", "pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx==0.28.1", "aiosqlite>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
customer-mcp = "assessment.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
